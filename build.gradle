plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.blamejared.com" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "lategameplus" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    fabricApi {
        configureDataGeneration {
            client = true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    clientImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") {
        transitive = false
    }
    compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}") {
        transitive = false
    }
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

def nonRuntimeAssetPatterns = [
    "**/*.kra", "**/*.kra~",
    "**/*.psd", "**/*.psd~",
    "**/*.xcf", "**/*.xcf~",
    "**/*.ase", "**/*.aseprite",
    "**/*.clip", "**/*.clip~",
    "**/*.ora", "**/*.ora~",
    "**/*.blend", "**/*.blend1",
    "**/*~"
]

processResources {
    inputs.property "version", project.version
    exclude(nonRuntimeAssetPatterns)
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    exclude(nonRuntimeAssetPatterns)
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

tasks.named("sourcesJar", Jar).configure {
    exclude(nonRuntimeAssetPatterns)
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
